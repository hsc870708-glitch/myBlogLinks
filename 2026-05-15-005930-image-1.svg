  <text x="86" y="158" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#111827">Selloff Day</text>
  <text x="86" y="196" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">Strike risk met profit-taking after a record run.</text>
  <g transform="translate(86 236)">
