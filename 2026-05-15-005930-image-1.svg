    <text x="360" y="169" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fda4af">KRW 270,500</text>
    <text x="386" y="194" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fda4af">-8.61%</text>
  </g>
  <g transform="translate(664 102)">
    <rect x="0" y="0" width="228" height="104" rx="22" fill="#ffffff" stroke="#d8e3f4"/>
