      <line x1="34" y1="86" x2="518" y2="86"/>
      <line x1="34" y1="136" x2="518" y2="136"/>
      <line x1="34" y1="186" x2="518" y2="186"/>
      <line x1="34" y1="24" x2="34" y2="186"/>
      <line x1="154" y1="24" x2="154" y2="186"/>
      <line x1="274" y1="24" x2="274" y2="186"/>
      <line x1="394" y1="24" x2="394" y2="186"/>
      <line x1="514" y1="24" x2="514" y2="186"/>
