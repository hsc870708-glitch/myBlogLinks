<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Hyundai Motor pullback summary</title>
  <desc id="desc">Editorial infographic summarizing Hyundai Motor's May 15 2026 pullback after a historic rise above KRW 700,000.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f8fc"/>
      <stop offset="100%" stop-color="#e7eef8"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f4f7fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#0f4c81"/>
      <stop offset="55%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#1f2937" flood-opacity="0.13"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <circle cx="896" cy="96" r="120" fill="#dce8fb"/>
  <circle cx="118" cy="468" r="120" fill="#edf4ff"/>
  <g filter="url(#shadow)">
    <rect x="44" y="42" width="912" height="476" rx="28" fill="url(#card)"/>
  </g>
  <text x="86" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#31558b">Hyundai Motor</text>
  <text x="86" y="154" font-family="Arial, Helvetica, sans-serif" font-size="42" font-weight="800" fill="#111827">Pause After Breakout</text>
  <text x="86" y="194" font-family="Arial, Helvetica, sans-serif" font-size="22" fill="#475569">A record run cooled as the market turned sharply lower.</text>
  <g transform="translate(86 234)">
    <rect x="0" y="0" width="548" height="214" rx="24" fill="#0f172a"/>
    <g opacity="0.18" stroke="#cbd5e1" stroke-width="1">
      <line x1="34" y1="36" x2="518" y2="36"/>
      <line x1="34" y1="86" x2="518" y2="86"/>
      <line x1="34" y1="136" x2="518" y2="136"/>
      <line x1="34" y1="186" x2="518" y2="186"/>
      <line x1="34" y1="24" x2="34" y2="186"/>
      <line x1="154" y1="24" x2="154" y2="186"/>
      <line x1="274" y1="24" x2="274" y2="186"/>
      <line x1="394" y1="24" x2="394" y2="186"/>
      <line x1="514" y1="24" x2="514" y2="186"/>
    </g>
    <path d="M40 154 C120 146, 186 112, 236 72 S336 24, 394 48 S454 96, 510 124" fill="none" stroke="url(#line)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="394" cy="48" r="8" fill="#7dd3fc"/>
    <circle cx="510" cy="124" r="8" fill="#fb7185"/>
    <text x="300" y="40" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#e2e8f0">First break above KRW 700,000</text>
    <text x="386" y="148" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#fecdd3">Close KRW 700,000</text>
    <text x="430" y="174" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#fecdd3">-1.69%</text>
  </g>
  <g transform="translate(664 102)">
    <rect x="0" y="0" width="228" height="104" rx="22" fill="#ffffff" stroke="#d8e3f4"/>
    <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#31558b">Market Mood</text>
    <text x="24" y="68" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#c2410c">Risk-Off</text>
    <text x="24" y="90" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">KOSPI dropped 6.12%</text>
  </g>
  <g transform="translate(664 228)">
    <rect x="0" y="0" width="228" height="104" rx="22" fill="#ffffff" stroke="#d8e3f4"/>
    <text x="24" y="34" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#31558b">Short-Term Driver</text>
    <text x="24" y="68" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#111827">Profit Taking</text>
    <text x="24" y="90" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Recent gains were digested.</text>
  </g>
  <g transform="translate(664 354)">
    <rect x="0" y="0" width="228" height="96" rx="22" fill="#ffffff" stroke="#d8e3f4"/>
    <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#31558b">Longer Story</text>
    <text x="24" y="62" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="800" fill="#065f46">SDV + Hybrid</text>
    <text x="24" y="84" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#64748b">Future-mobility rerating remains.</text>
  </g>
  <text x="86" y="492" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">A pullback day, but not a clean break in the medium-term narrative.</text>
</svg>