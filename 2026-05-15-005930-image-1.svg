    <text x="24" y="32" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#31558b">Bigger Picture</text>
    <text x="24" y="62" font-family="Arial, Helvetica, sans-serif" font-size="26" font-weight="800" fill="#065f46">AI Memory Intact</text>
