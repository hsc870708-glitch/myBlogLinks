<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Electronics issue balance</title>
  <desc id="desc">Editorial support image contrasting Samsung Electronics strike risk with AI memory momentum and the market's next checkpoints.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7fafc"/>
      <stop offset="100%" stop-color="#eef4f8"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="20" flood-color="#23324a" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#bg2)"/>
  <rect x="52" y="44" width="896" height="472" rx="28" fill="#ffffff" filter="url(#shadow2)"/>
  <text x="88" y="110" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#365486">What the Market Is Weighing</text>
  <text x="88" y="154" font-family="Arial, Helvetica, sans-serif" font-size="40" font-weight="800" fill="#111827">Risk Now vs Growth Later</text>
  <text x="88" y="192" font-family="Arial, Helvetica, sans-serif" font-size="21" fill="#475569">The stock fell because short-term uncertainty spoke louder than strong quarterly numbers.</text>
  <g transform="translate(122 244)">
    <line x1="308" y1="26" x2="190" y2="130" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <line x1="308" y1="26" x2="426" y2="130" stroke="#475569" stroke-width="10" stroke-linecap="round"/>
    <line x1="308" y1="26" x2="308" y2="220" stroke="#475569" stroke-width="12" stroke-linecap="round"/>
    <path d="M248 220 H368" stroke="#1f2937" stroke-width="14" stroke-linecap="round"/>
    <g transform="translate(80 116)">
      <rect x="0" y="0" width="218" height="130" rx="24" fill="#fff1f2" stroke="#fecdd3"/>
      <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#be123c">Near-Term Risk</text>
      <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Union strike plan</text>
      <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Production timing worries</text>
      <text x="24" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Heavy foreign selling</text>
    </g>
    <g transform="translate(318 96)">
      <rect x="0" y="0" width="218" height="130" rx="24" fill="#ecfdf5" stroke="#bbf7d0"/>
      <text x="24" y="38" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="800" fill="#047857">Medium-Term Support</text>
      <text x="24" y="70" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Record Q1 earnings</text>
      <text x="24" y="96" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">AI memory demand</text>
      <text x="24" y="122" font-family="Arial, Helvetica, sans-serif" font-size="17" fill="#374151">Broker target raised</text>
    </g>
  </g>
  <g transform="translate(676 236)">
    <rect x="0" y="0" width="220" height="70" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="28" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Checkpoint 1</text>
    <text x="22" y="52" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Will labor talks restart?</text>
    <rect x="0" y="92" width="220" height="70" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="120" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Checkpoint 2</text>
    <text x="22" y="144" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Does foreign selling slow?</text>
    <rect x="0" y="184" width="220" height="70" rx="18" fill="#eff6ff" stroke="#bfdbfe"/>
    <text x="22" y="212" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#1d4ed8">Checkpoint 3</text>
    <text x="22" y="236" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#111827">Can AI memory stay in focus?</text>
  </g>
  <text x="88" y="488" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The next move depends on whether fear fades before the earnings story does.</text>
</svg>