<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Hyundai Motor pressure versus rerating</title>
  <desc id="desc">Supporting infographic contrasting Hyundai Motor's earnings pressure with future-mobility rerating hopes.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f7f9fc"/>
      <stop offset="100%" stop-color="#edf2fa"/>
    </linearGradient>
    <linearGradient id="leftGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#1e3a8a"/>
      <stop offset="100%" stop-color="#60a5fa"/>
    </linearGradient>
    <linearGradient id="rightGlow" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#7f1d1d"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>
    <filter id="shadow2" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#bg2)"/>
  <g filter="url(#shadow2)">
    <rect x="42" y="42" width="916" height="476" rx="28" fill="#ffffff"/>
  </g>
  <rect x="70" y="86" width="394" height="388" rx="26" fill="#0f172a"/>
  <rect x="536" y="86" width="394" height="388" rx="26" fill="#1f2937"/>
  <text x="98" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#bfdbfe">Future Side</text>
  <text x="98" y="164" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Hybrid + SDV</text>
  <text x="98" y="194" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#cbd5e1">New products, software and mobility rerating continue to support the story.</text>
  <g transform="translate(98 234)">
    <rect x="0" y="0" width="126" height="126" rx="20" fill="#111c32" stroke="#3b82f6"/>
    <circle cx="42" cy="42" r="14" fill="#dbeafe"/>
    <circle cx="84" cy="42" r="14" fill="#93c5fd"/>
    <rect x="28" y="74" width="56" height="18" rx="6" fill="#60a5fa"/>
    <text x="156" y="34" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#e2e8f0">Robotics / SDV / Hybrid</text>
    <text x="156" y="66" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1">New Grandeur launch</text>
    <text x="156" y="96" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1">AAOS-based Pleos Connect</text>
    <text x="156" y="126" font-family="Arial, Helvetica, sans-serif" font-size="16" fill="#cbd5e1">Next-gen hybrid system</text>
  </g>
  <path d="M100 420 C170 398, 238 364, 310 314 S398 250, 438 228" fill="none" stroke="url(#leftGlow)" stroke-width="9" stroke-linecap="round"/>
  <circle cx="438" cy="228" r="8" fill="#93c5fd"/>
  <text x="564" y="126" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="700" fill="#fecaca">Pressure Side</text>
  <text x="564" y="164" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="800" fill="#ffffff">Costs and Tariffs</text>
  <text x="564" y="194" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#d1d5db">Margins are under pressure even as revenue stays large.</text>
  <g transform="translate(564 234)">
    <rect x="0" y="0" width="320" height="150" rx="20" fill="#111827"/>
    <g opacity="0.16" stroke="#cbd5e1" stroke-width="1">
      <line x1="24" y1="28" x2="296" y2="28"/>
      <line x1="24" y1="70" x2="296" y2="70"/>
      <line x1="24" y1="112" x2="296" y2="112"/>
      <line x1="24" y1="18" x2="24" y2="126"/>
      <line x1="92" y1="18" x2="92" y2="126"/>
      <line x1="160" y1="18" x2="160" y2="126"/>
      <line x1="228" y1="18" x2="228" y2="126"/>
      <line x1="296" y1="18" x2="296" y2="126"/>
    </g>
    <path d="M28 34 C92 36, 142 42, 188 64 S242 96, 292 116" fill="none" stroke="url(#rightGlow)" stroke-width="8" stroke-linecap="round"/>
    <circle cx="292" cy="116" r="8" fill="#fb7185"/>
    <text x="28" y="138" font-family="Arial, Helvetica, sans-serif" font-size="15" fill="#fecaca">Q1 op profit KRW 2.51T</text>
  </g>
  <text x="74" y="510" font-family="Arial, Helvetica, sans-serif" font-size="18" fill="#475569">The market is balancing short-term margin pressure against a broader future-mobility rerating.</text>
</svg>