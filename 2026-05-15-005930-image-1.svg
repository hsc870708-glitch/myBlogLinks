<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="560" viewBox="0 0 1000 560" role="img" aria-labelledby="title desc">
  <title id="title">Samsung Electronics selloff summary</title>
  <desc id="desc">Editorial infographic summarizing Samsung Electronics' May 15, 2026 selloff with strike risk and AI memory demand context.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f5f7fb"/>
      <stop offset="100%" stop-color="#e7edf9"/>
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f3f6fc"/>
    </linearGradient>
    <linearGradient id="line" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0%" stop-color="#113a7d"/>
      <stop offset="55%" stop-color="#1f6feb"/>
      <stop offset="100%" stop-color="#d9485f"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="18" flood-color="#273244" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1000" height="560" fill="url(#bg)"/>
  <circle cx="900" cy="86" r="120" fill="#dce7fb"/>
  <circle cx="100" cy="470" r="130" fill="#eaf2ff"/>
